# Exemplo de definição de itens. Cada chave de nível superior é o id do item
# (minúsculas, números e _). Use /cc recarregar para aplicar mudanças e /cc dar <id> para receber.
# Textos usam MiniMessage: <gold>, <gray>, <bold>...
#
# Campos (todos opcionais, exceto material):
#   material, nome, lore, inquebravel, brilho,
#   encantamentos: {sharpness: 3}            (nome do encantamento: nível)
#   atributos: lista de {atributo, valor, operacao, slot}
#       operacao: add_number (padrão) | add_scalar | multiply_scalar_1
#       slot: any (padrão) | mainhand | offhand | hand | head | chest | legs | feet | armor | body
#       ATENÇÃO: se houver atributos, eles SUBSTITUEM os do item base (dano/velocidade da espada, armadura...).
#       O jogador tem base 1 de dano e 4 de velocidade: uma espada de diamante é +7 de dano e -2.4 de velocidade.
#   modelo: nome do modelo no resource pack (ver tools/pack/build.py). O material do item deve ser o
#       mesmo do modelo no pack. Sem o pack, o item aparece com o visual vanilla do material.
#   receita: tipo shaped (forma + ingredientes) ou shapeless (ingredientes: [lista]); quantidade opcional.
#       Ingrediente: nome de material (EMERALD) ou cc:<id> para outro item do CreatorCore.
#   cozimento: lista de receitas que PRODUZEM este item: {tipo, entrada, xp, tempo, quantidade}
#       tipo: furnace (padrão, 200 ticks) | blasting (100) | smoking (100) | campfire (600)
#       entrada: material ou cc:<id>; xp: experiência (padrão 0); tempo em ticks; quantidade 1-64.
#       Vale também nos blocos.

#   habilidades: lista de {gatilho, recarga, consumir, acoes}
#       gatilho: right_click | sneak_right_click (com Shift) | left_click | hit (bater numa entidade)
#       recarga: segundos (padrão 0); consumir: true gasta 1 unidade ao usar (padrão false)
#       acoes: lista de {tipo, ...}; "em: alvo" aplica ao alvo (entidade atingida ou mirada, até 20 blocos)
#         efeito:   {tipo: efeito, efeito: speed, duracao: 10, nivel: 2, em: jogador|alvo}
#         curar:    {tipo: curar, valor: 6, em: jogador|alvo}
#         dano:     {tipo: dano, valor: 4, em: alvo}
#         raio:     {tipo: raio, em: alvo}
#         projetil: {tipo: projetil, entidade: SNOWBALL, valor: 1.5}   (valor = velocidade)
#         impulso:  {tipo: impulso, valor: 1.2}  (empurra o jogador para onde olha)
#         som:      {tipo: som, texto: entity.player.levelup, valor: 1}
#         comando:  {tipo: comando, texto: "say %jogador% usou!"}  (roda no console; só o dono do servidor edita)
#   armadura: {slot, textura, protecao, resistencia}  -> item vestível com textura própria no corpo
#       slot: head | chest | legs | feet; textura: nome dos arquivos armor/<textura>_1.png (capacete,
#       peitoral, botas) e armor/<textura>_2.png (calças), camadas humanoides 64x32 do Minecraft.
#       protecao: pontos de armadura (0-30); resistencia: armor toughness (0-20).
#       O ícone do item vem do material (ou de "modelo:"); o material é só o ícone, qualquer um serve.
#   Itens com modelo 3D do Blockbench: o bloco "display" do projeto (thirdperson_righthand,
#       firstperson_righthand, gui, ground...) controla o tamanho/posição na mão, no inventário e no chão.

cajado_teste:
  material: STICK
  nome: "<light_purple>Cajado de Teste"
  lore:
    - "<gray>Clique direito: bola de neve rápida."
    - "<gray>Shift + direito: impulso. Bater: raio."
  brilho: true
  habilidades:
    - gatilho: right_click
      recarga: 1
      acoes:
        - {tipo: projetil, entidade: SNOWBALL, valor: 2}
        - {tipo: som, texto: entity.snowball.throw}
    - gatilho: sneak_right_click
      recarga: 3
      acoes:
        - {tipo: impulso, valor: 1.5}
        - {tipo: efeito, efeito: slow_falling, duracao: 5}
    - gatilho: hit
      recarga: 5
      acoes:
        - {tipo: raio, em: alvo}

ferro_polido:
  material: IRON_INGOT
  nome: "<white>Ferro Polido"
  brilho: true
  cozimento:
    - {tipo: furnace, entrada: IRON_INGOT, xp: 0.7}
    - {tipo: blasting, entrada: IRON_INGOT, xp: 0.7}

diamante_polido:
  material: DIAMOND
  nome: "<aqua>Diamante Polido"
  lore:
    - "<gray>Ingrediente para criações melhores."
  brilho: true
  modelo: diamante_polido
  receita:
    tipo: shapeless
    ingredientes: [DIAMOND, DIAMOND]

espada_teste:
  material: DIAMOND_SWORD
  nome: "<gold>Espada de Teste"
  lore:
    - "<gray>Primeira criação do CreatorCore."
  inquebravel: true
  modelo: espada_teste
  encantamentos:
    sharpness: 3
  atributos:
    - {atributo: attack_damage, valor: 9, operacao: add_number, slot: mainhand}
    - {atributo: attack_speed, valor: -2.0, operacao: add_number, slot: mainhand}
  receita:
    tipo: shaped
    forma:
      - " P "
      - " P "
      - " S "
    ingredientes:
      P: cc:diamante_polido
      S: STICK

golem_miniatura:
  material: AMETHYST_SHARD
  nome: "<gold>Golem em Miniatura"
  lore: ["<gray>Item com modelo importado do Blockbench."]
  modelo: golem_teste

capacete_rubi:
  material: IRON_HELMET
  nome: "<red>Capacete de Rubi"
  armadura: {slot: head, textura: rubi, protecao: 3, resistencia: 1}

peitoral_rubi:
  material: IRON_CHESTPLATE
  nome: "<red>Peitoral de Rubi"
  armadura: {slot: chest, textura: rubi, protecao: 8, resistencia: 1}

calca_rubi:
  material: IRON_LEGGINGS
  nome: "<red>Calça de Rubi"
  armadura: {slot: legs, textura: rubi, protecao: 6, resistencia: 1}

botas_rubi:
  material: IRON_BOOTS
  nome: "<red>Botas de Rubi"
  armadura: {slot: feet, textura: rubi, protecao: 3, resistencia: 1}