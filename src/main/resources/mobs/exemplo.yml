# Exemplo de definição de mobs. Cada chave de nível superior é o id do mob
# (minúsculas, números e _). Use /cc recarregar para aplicar e /cc invocar <id> para criá-lo.
# Textos usam MiniMessage: <gold>, <gray>, <bold>...
#
# Campos:
#   tipo: mob vanilla de base (obrigatório): ZOMBIE, SKELETON, SPIDER, COW...
#   nome: nome exibido acima do mob (opcional)
#   atributos: valores base, ex.: max_health, movement_speed, attack_damage, follow_range, scale,
#       armor, knockback_resistance (nem todo mob tem todos os atributos)
#   equipamento: mainhand, offhand, head, chest, legs, feet = material (DIAMOND_SWORD) ou cc:<id>
#       (o equipamento nunca dropa; use drops)
#   drops: lista de {item, quantidade}; item = material ou cc:<id>; quantidade = 2 ou 1-3
#   drops-vanilla: true mantém também os drops normais da espécie (padrão false)
#   xp: experiência ao morrer (padrão: a vanilla)
#   brilho: true = contorno brilhante; silencioso: true = sem sons
#   modelo: (opcional) modelo do Blockbench em models/<id>.bbmodel. O mob base fica invisível e um modelo
#       acompanha seus movimentos; escala-modelo (padrão 1.0) e deslocamento-y (padrão 0) ajustam o tamanho e a altura.
#       rotacao-modelo (padrão 180) gira o modelo: o Blockbench/Bedrock desenha a frente voltada para o norte.
#       Equipamento fica oculto com modelo. Sem o pack ou sem o arquivo, o mob usa o visual do mob base.
#   spawn: (opcional) spawn natural. Quando o jogo faria nascer o mob de "tipo", ele é trocado por este.
#       chance: de 0 a 1 (padrão 0.1) | limite: máximo vivo por mundo (padrão 10)
#       mundos: [world] e biomas: [plains, forest] (omitidos = qualquer)
#   drops também aceitam chance: 0.25 (0 a 1) e so-jogador: true (só dropa se um jogador deu o golpe final).
#   comportamento: (opcional)
#       passivo: true            = nunca ataca ninguém
#       domavel: {item: BONE, chance: 0.5}  = clique direito com o item doma o mob (o dono não o fere, ele o segue
#                                  e não o ataca)
#       distancia: {projetil: ARROW, velocidade: 1.6, alcance: 16, intervalo: 2, dano: 4}
#                                  = atira no alvo à distância (projetil: ARROW, SNOWBALL, SMALL_FIREBALL, WIND_CHARGE...)
#       habilidades: mesmas ações dos itens (efeito, curar, dano, raio, projetil, som, impulso, comando);
#                    "em: jogador" vale para o próprio mob e "em: alvo" para quem ele enfrenta.
#                    gatilho: atacar (ao ferir alguém) | ferido (ao ser ferido) | periodica (a cada "recarga"
#                    segundos, enquanto tem alvo; a recarga é obrigatória)
#
# O mob não some por distância (persistente). Visual = o do mob vanilla (sem textura própria).

zumbi_forte:
  tipo: ZOMBIE
  nome: "<red>Zumbi Forte"
  atributos:
    max_health: 60
    movement_speed: 0.28
    attack_damage: 6
  equipamento:
    mainhand: DIAMOND_SWORD
    head: IRON_HELMET
  drops:
    - {item: "cc:diamante_polido", quantidade: "1-2"}
  xp: 30
  brilho: true
  spawn:
    chance: 0.05
    limite: 5
    mundos: [world]

golem_teste:
  tipo: ZOMBIE
  nome: "<gold>Golem de Teste"
  modelo: golem_teste
  escala-modelo: 1.0
  atributos:
    max_health: 40
    movement_speed: 0.2
robo_geo:
  tipo: ZOMBIE
  nome: "<aqua>Robô (GeckoLib)"
  modelo: robo_geo
  atributos: {max_health: 30}
# --- Comportamento (0.15.0) ---
esqueleto_mago:
  tipo: SKELETON
  nome: "<light_purple>Esqueleto Mago"
  atributos: {max_health: 30}
  comportamento:
    distancia: {projetil: SMALL_FIREBALL, velocidade: 1.2, alcance: 20, intervalo: 3}
    habilidades:
      - gatilho: ferido
        recarga: 8
        acoes:
          - {tipo: efeito, efeito: speed, duracao: 4, nivel: 2}
  drops:
    - {item: "cc:diamante_polido", quantidade: 1, chance: 0.3, so-jogador: true}

lobo_manso:
  tipo: WOLF
  nome: "<yellow>Lobo Manso"
  atributos: {max_health: 24}
  comportamento:
    passivo: true
    domavel: {item: BONE, chance: 0.5}