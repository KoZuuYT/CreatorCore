# CreatorCore — configuração
updater:
  # Baixa sozinho o jar da última release do GitHub (aplicado no próximo reinício).
  enabled: true
  repository: KoZuuYT/CreatorCore
  check-interval-minutes: 30
  # Desliga o servidor quando vazio e há atualização baixada (para um painel/script religar).
  restart-when-empty: false

resourcepack:
  # Por padrão o pack é descoberto sozinho pela release mais recente do GitHub (updater.repository),
  # com cache local em pack-cache.properties. Sem internet, vale o último pack em cache.
  enabled: true
  # Envia o pack ao jogador quando ele entra (/cc pacote reenvia manualmente).
  send-on-join: true
  # false = opcional: quem recusar joga com os itens em visual vanilla.
  required: false
  # Nome do arquivo anexado à release.
  asset: "CreatorCore-Pack.zip"
  # Link manual: se preenchido, substitui o automático (informe também o sha1 do .zip).
  url: ""
  sha1: ""
