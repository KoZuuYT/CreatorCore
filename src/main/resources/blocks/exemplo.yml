# Exemplo de definição de blocos. Cada chave de nível superior é o id do bloco
# (minúsculas, números e _). Use /cc recarregar para aplicar e /cc dar <id> para receber o item do bloco.
# Textos usam MiniMessage: <gold>, <gray>, <bold>...
#
# Campos (todos opcionais):
#   nome, lore
#   modelo: nome do modelo em blocks.json / resource pack (padrão: o próprio id). O modelo precisa
#       existir em src/main/resources/blocks.json e ser desenhado em tools/pack/build.py.
#   dureza: tempo de quebra (padrão 1.0; pedra = 1.5; 0 = instantâneo; negativo = indestrutível em sobrevivência)
#   ferramenta: none (padrão) | pickaxe | axe | shovel | hoe   (acelera a quebra)
#   nivel: wood (padrão) | stone | iron | diamond | netherite   (nível mínimo para dropar)
#   requer-ferramenta: true = sem a ferramenta certa (e nível) quebra mais devagar e NÃO dropa
#   drops: lista de {item, quantidade}; item = material (DIAMOND) ou cc:<id>; quantidade = 2 ou 1-3.
#       Sem drops, o bloco dropa a si mesmo.
#   receita: igual à dos itens (shaped/shapeless).
#
# Limitações: o tempo de quebra ignora Pressa/Fadiga e debaixo d'água; pistões não movem estes blocos;
# o som é o de madeira do note block.

minerio_teste:
  nome: "<aqua>Minério de Teste"
  lore:
    - "<gray>Precisa de picareta de ferro ou melhor."
  modelo: minerio_teste
  dureza: 3.0
  ferramenta: pickaxe
  nivel: iron
  requer-ferramenta: true
  drops:
    - {item: "cc:diamante_polido", quantidade: "1-3"}

bloco_polido:
  nome: "<aqua>Bloco Polido"
  lore:
    - "<gray>Nove diamantes polidos juntos."
  modelo: bloco_polido
  dureza: 2.0
  ferramenta: pickaxe
  receita:
    tipo: shaped
    forma: ["PPP", "PPP", "PPP"]
    ingredientes: {P: "cc:diamante_polido"}
